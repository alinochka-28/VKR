version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cognitive_bot_postgres
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: cogdb
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d cogdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cognitive_network

  bot:
    build: .
    container_name: cognitive_bot
    environment:
      DB_URL: postgresql+asyncpg://bot:botpass@postgres:5432/cogdb
      BOT_TOKEN: ${VK_TOKEN}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - cognitive_network

networks:
  cognitive_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local